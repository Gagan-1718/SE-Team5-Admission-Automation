name: CI

# Runs the whole pytest suite on every push and on every pull request into main,
# so each PR shows a green or red check before the repo owner reviews and merges it.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-https.txt ]; then pip install -r requirements-https.txt; fi

      - name: Run the tests
        run: python -m pytest -q
