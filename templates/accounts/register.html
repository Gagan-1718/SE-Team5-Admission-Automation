{% extends "base.html" %}
{% block title %}Candidate registration{% endblock %}
{% block content %}
<h1>Candidate registration</h1>
<form method="post" id="registration-form">
  <label for="name">Name</label><input id="name" name="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="mobile">Mobile</label><input id="mobile" name="mobile" inputmode="numeric" required>
  <label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required>
  <button type="submit">Register</button>
  <p id="message" role="alert"></p>
</form>
<script>
document.getElementById("registration-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const response = await fetch("{{ url_for('accounts.register') }}", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.fromEntries(new FormData(event.target)))
  });
  const data = await response.json();
  document.getElementById("message").textContent = data.message || "Registration failed.";
});
</script>
{% endblock %}
